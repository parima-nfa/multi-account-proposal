<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FrontierOne — Multi-Account Proposal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    /* NFA core primitives — light */
    --canvas:#F2F3F6; --surface:#FFFFFF; --subtle:#E2E4E9; --inverse:#1B1C20;
    --t-primary:#23242A; --t-secondary:#5D616A; --t-disabled:#8B8F97; --t-link:#3D3CD3;
    --b-default:#C4C7CE; --b-subtle:#E2E4E9; --b-focus:#4C57E9;
    --brand:#4C57E9; --brand-hover:#3D3CD3; --brand-active:#272695; --brand-subtle:#CDDBFF; --brand-onsubtle:#3D3CD3;
    --success-d:#10B981; --success-bg:#ECFDF3; --success-tx:#047857;
    --danger-d:#B91C1C; --danger-bg:#FEF2F2; --danger-tx:#B91C1C;
    --warning-d:#B45309; --warning-bg:#FFFBEB; --warning-tx:#92400E;
    --warning-tint: color-mix(in srgb, var(--warning-d) 16%, var(--surface));
    --danger-tint:  color-mix(in srgb, var(--danger-d) 16%, var(--surface));
    --success-tint: color-mix(in srgb, var(--success-d) 16%, var(--surface));
    --warning-tint-canvas: color-mix(in srgb, var(--warning-d) 16%, var(--canvas));
    --danger-tint-canvas:  color-mix(in srgb, var(--danger-d) 16%, var(--canvas));
    --success-tint-canvas: color-mix(in srgb, var(--success-d) 16%, var(--canvas));
    --t-onbrand:#FFFFFF;
    --chart-fixed:#3D3CD3; --chart-us:#0C97B6; --chart-intl:#9E2DCF; --chart-alts:#6E8CF7; --chart-cash:#8B8F97;
    --tn-bg:#CDDBFF; --tn-lbl:#3D3CD3; --tn-press:#A4B8FF; --tn-hover:#B9CAFF; --tn-hover-lbl:#3D3CD3;
    color-scheme: light;

    /* aliases used throughout this file — map to the primitives above */
    --bg: var(--canvas);
    --card: var(--surface);
    --border: var(--b-subtle);
    --border-strong: var(--b-default);
    --ink: var(--t-primary);
    --ink-2: var(--t-secondary);
    --ink-3: var(--t-disabled);
    --indigo: var(--brand);
    --indigo-600: var(--brand-hover);
    --indigo-50: var(--brand-subtle);
    --indigo-100: var(--brand-subtle);
    --teal: var(--success-d);
    --amber-bg: var(--warning-bg);
    --amber-text: var(--warning-tx);
    --amber-border: var(--warning-d);
    --red-bg: var(--danger-bg);
    --red-text: var(--danger-tx);
    --red-border: var(--danger-d);
    --green-bg: var(--success-bg);
    --green-text: var(--success-tx);
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 1px 2px rgba(20,20,50,0.04), 0 1px 8px rgba(20,20,50,0.04);
  }
  :root[data-theme="dark"] {
    --canvas:#1B1C20; --surface:#23242A; --subtle:#2C2E35; --inverse:#FFFFFF;
    --t-primary:#F2F3F6; --t-secondary:#8B8F97; --t-disabled:#5D616A; --t-link:#6E8CF7;
    --b-default:#3A3D45; --b-subtle:#2C2E35; --b-focus:#6E8CF7;
    --brand:#4C57E9; --brand-hover:#3D3CD3; --brand-active:#272695; --brand-subtle:#111057; --brand-onsubtle:#8AA3FC;
    --success-d:#10B981; --success-bg:#047857; --success-tx:#D1FAE5;
    --danger-d:#F87171; --danger-bg:#B91C1C; --danger-tx:#FEE2E2;
    --warning-d:#F59E0B; --warning-bg:#B45309; --warning-tx:#FEF3C7;
    --warning-tint: color-mix(in srgb, var(--warning-d) 12%, var(--surface));
    --danger-tint:  color-mix(in srgb, var(--danger-d) 12%, var(--surface));
    --success-tint: color-mix(in srgb, var(--success-d) 12%, var(--surface));
    --warning-tint-canvas: color-mix(in srgb, var(--warning-d) 12%, var(--canvas));
    --danger-tint-canvas:  color-mix(in srgb, var(--danger-d) 12%, var(--canvas));
    --success-tint-canvas: color-mix(in srgb, var(--success-d) 12%, var(--canvas));
    --t-onbrand:#FFFFFF; --chart-fixed:#6E8CF7; --chart-us:#2ACFE1; --chart-intl:#CC73F5; --chart-alts:#A4B8FF; --chart-cash:#8B8F97; --tn-bg:rgba(138,163,252,.16); --tn-lbl:#A4B8FF; --tn-press:rgba(138,163,252,.24); --tn-hover:rgba(138,163,252,.20); --tn-hover-lbl:#A4B8FF;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --canvas:#1B1C20; --surface:#23242A; --subtle:#2C2E35; --inverse:#FFFFFF;
      --t-primary:#F2F3F6; --t-secondary:#8B8F97; --t-disabled:#5D616A; --t-link:#6E8CF7;
      --b-default:#3A3D45; --b-subtle:#2C2E35; --b-focus:#6E8CF7;
      --brand:#4C57E9; --brand-hover:#3D3CD3; --brand-active:#272695; --brand-subtle:#111057; --brand-onsubtle:#8AA3FC;
      --success-d:#10B981; --success-bg:#047857; --success-tx:#D1FAE5;
      --danger-d:#F87171; --danger-bg:#B91C1C; --danger-tx:#FEE2E2;
      --warning-d:#F59E0B; --warning-bg:#B45309; --warning-tx:#FEF3C7;
      --warning-tint: color-mix(in srgb, var(--warning-d) 12%, var(--surface));
      --danger-tint:  color-mix(in srgb, var(--danger-d) 12%, var(--surface));
      --success-tint: color-mix(in srgb, var(--success-d) 12%, var(--surface));
      --warning-tint-canvas: color-mix(in srgb, var(--warning-d) 12%, var(--canvas));
      --danger-tint-canvas:  color-mix(in srgb, var(--danger-d) 12%, var(--canvas));
      --success-tint-canvas: color-mix(in srgb, var(--success-d) 12%, var(--canvas));
      --t-onbrand:#FFFFFF; --chart-fixed:#6E8CF7; --chart-us:#2ACFE1; --chart-intl:#CC73F5; --chart-alts:#A4B8FF; --chart-cash:#8B8F97; --tn-bg:rgba(138,163,252,.16); --tn-lbl:#A4B8FF; --tn-press:rgba(138,163,252,.24); --tn-hover:rgba(138,163,252,.20); --tn-hover-lbl:#A4B8FF;
      color-scheme: dark;
    }
  }
  html { transition: background .2s, color .2s; }
  * { transition: background-color .15s, border-color .15s, color .15s; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }
  #app { display: flex; min-height: 100vh; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 268px; flex-shrink: 0;
    background: var(--card);
    border-right: 1px solid var(--border);
    padding: 20px 14px;
    display: flex; flex-direction: column; gap: 2px;
    min-height: 100vh;
  }
  .sidebar-spacer { flex: 1; }
  .theme-toggle {
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding: 10px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border-strong);
    margin-top: 12px; background: var(--surface); cursor:pointer;
  }
  .theme-toggle:hover { background: var(--subtle); }
  .theme-toggle .tt-label { font-size:12.5px; font-weight:600; color: var(--ink-2); display:flex; align-items:center; gap:8px; }
  .tt-switch { width:34px; height:20px; border-radius:999px; background: var(--t-secondary); position:relative; flex-shrink:0; }
  .tt-switch.on { background: var(--brand); }
  .tt-switch::after {
    content:''; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%;
    background: var(--surface); transition: left .15s;
  }
  .tt-switch.on::after { left:16px; }
  .brand { display:flex; align-items:center; gap:8px; padding: 4px 8px 18px; }
  .brand-mark { width:20px; height:20px; border:2px solid var(--ink); border-radius:4px; }
  .brand-name { font-weight:600; font-size:14px; letter-spacing:0.02em; }
  .nav-item {
    padding: 9px 10px; border-radius: var(--radius-sm);
    color: var(--ink-2); font-size: 13.5px; cursor: pointer;
    display:flex; align-items:center; justify-content:space-between;
  }
  .nav-item:hover { background: var(--subtle); }
  .nav-item.active { background: var(--tn-bg); color: var(--tn-lbl); font-weight: 600; }
  .nav-sub { margin-left: 8px; padding-left: 10px; border-left: 2px solid var(--border); display:flex; flex-direction:column; gap:2px; margin-top:2px; margin-bottom:6px;}
  .nav-account-row {
    padding: 7px 8px; border-radius: var(--radius-sm); cursor:pointer;
    display:flex; align-items:center; justify-content:space-between; gap:6px;
  }
  .nav-account-row:hover { background: var(--subtle); }
  .nav-account-row.active-acct { background: var(--tn-bg); }
  .nav-account-row.active-acct .name { color: var(--tn-lbl); }
  .nav-account-row .name-wrap { min-width:0; flex:1; }
  .nav-account-row .name { font-size: 12.5px; color: var(--ink); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block; }
  .nav-account-row .num-inline { color: var(--ink-3); font-weight:500; }
  .side-tag { font-size:9.5px; font-weight:700; padding:2px 6px; border-radius:5px; flex-shrink:0; white-space:nowrap; }
  .side-tag.not_started { background: var(--subtle); color: var(--t-disabled); }
  .side-tag.tax_review { background: var(--warning-tint); color: var(--amber-text); }
  .side-tag.complete { background: var(--success-tint); color: var(--green-text); }

  /* ---------- Sidebar stepper ---------- */
  .step-item { padding:10px 10px; border-radius: var(--radius-sm); display:flex; align-items:center; gap:9px; color: var(--ink-2); font-size:13.5px; }
  .step-item.clickable { cursor:pointer; }
  .step-item.clickable:hover { background: var(--subtle); }
  .step-item[aria-disabled="true"] { color: var(--t-disabled); cursor:not-allowed; }
  .step-item.current { background: var(--tn-bg); color: var(--tn-lbl); font-weight:600; }
  .step-num { width:18px; height:18px; border-radius:50%; border:1.5px solid currentColor; display:flex; align-items:center; justify-content:center; font-size:9.5px; flex-shrink:0; font-weight:700; }
  .step-check { color: var(--success-tx); font-size:14px; flex-shrink:0; width:18px; text-align:center; }
  .step-sub { font-size:11.5px; color: var(--t-secondary); margin-top:2px; font-weight:400; }
  .step-body { flex:1; min-width:0; }
  .step-row-head { display:flex; align-items:center; justify-content:space-between; gap:6px; }

  /* ---------- Main ---------- */
  .main { flex: 1; min-width:0; display:flex; flex-direction:column; }
  .topbar {
    background: var(--card); border-bottom: 1px solid var(--border);
    padding: 14px 28px; display:flex; align-items:center; justify-content:space-between;
  }
  .topbar-fields { display:flex; gap:36px; }
  .tf-label { font-size:11px; color: var(--ink-3); margin-bottom:2px; }
  .tf-value { font-size:13.5px; font-weight:600; color: var(--ink); }
  .topbar-actions { display:flex; gap:8px; align-items:center; }
  .btn-save-exit {
    background: var(--tn-bg); color: var(--tn-lbl); border:none; font-weight:600;
    padding:8px 16px; border-radius: var(--radius-sm); font-size:13px; cursor:pointer;
  }
  .btn-reset {
    background: transparent; color: var(--t-secondary); border:1px solid var(--t-secondary); font-weight:600;
    padding:8px 14px; border-radius: var(--radius-sm); font-size:13px; cursor:pointer;
  }
  .btn-reset:hover { border-color: var(--danger-d); color: var(--danger-d); }
  .content { padding: 28px 32px 60px; max-width: 1180px; width:100%; margin: 0 auto; }

  h1.page-title { font-size: 22px; margin: 0 0 4px; font-weight:700; }
  p.page-sub { color: var(--ink-2); margin: 0 0 22px; font-size:13.5px; }

  /* ---------- Cards / Summary ---------- */
  .summary-row { display:flex; gap:14px; margin-bottom:18px; }
  .summary-card {
    background: var(--card); border:1px solid var(--border); border-radius: var(--radius);
    padding: 14px 18px; flex:1; box-shadow: var(--shadow);
  }
  .summary-card .label { font-size:11.5px; color: var(--ink-3); margin-bottom:4px; }
  .summary-card .val { font-size:20px; font-weight:700; }

  .banner {
    border-radius: var(--radius); padding: 12px 16px; font-size:13px; margin-bottom:16px;
    display:flex; gap:10px; align-items:flex-start;
  }
  .banner.amber { background: var(--warning-tint); color: var(--amber-text); border:1px solid var(--amber-border); }
  .banner.red { background: var(--danger-tint); color: var(--red-text); border:1px solid var(--red-border); }
  .banner.neutral { background: var(--subtle); color: var(--ink-2); border:1px solid var(--border); }
  .banner.tonal { background: var(--tn-bg); color: var(--tn-lbl); border:1px solid var(--tn-bg); border-left:4px solid var(--brand); font-size:14px; }
  .banner.tonal b { color: var(--tn-lbl); }
  .banner.prompt { background: var(--warning-tint); color: var(--warning-tx); border:1px solid var(--warning-d); border-left:4px solid var(--warning-d); font-size:14px; display:flex; align-items:flex-start; gap:10px; }
  .banner.prompt b { color: var(--warning-tx); }
  .banner-icon { flex-shrink:0; width:22px; height:22px; margin-top:1px; }
  .banner b { font-weight:700; }
  .banner .fix-link { color: var(--t-link); font-weight:600; cursor:pointer; text-decoration:underline; }

  /* ---------- Table ---------- */
  .table-card { background: var(--card); border:1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow:hidden; }
  table { width:100%; border-collapse: collapse; }
  thead th {
    text-align:left; font-size:11px; color: var(--t-secondary); font-weight:700;
    text-transform: uppercase; letter-spacing:0.5px;
    padding: 13px 13px; border-bottom:1px solid var(--b-subtle); background: var(--subtle);
  }
  .th-sort { cursor:pointer; display:inline-flex; align-items:center; gap:5px; user-select:none; }
  .th-sort:hover { color: var(--t-link); }
  .sort-arrows { display:inline-flex; flex-direction:column; line-height:0.55; font-size:8px; letter-spacing:0; }
  .sort-arrows span { color: var(--t-secondary); }
  .sort-arrows span.active { color: var(--t-link); }
  tbody td { padding: 13px 13px; border-bottom:1px solid var(--border); font-size:13.5px; vertical-align:middle; }
  tbody tr:last-child td { border-bottom:none; }
  tbody tr.clickable:hover { background: var(--tn-bg); cursor:pointer; }
  .acct-name { font-weight:600; color: var(--ink); }
  .acct-name:hover { color: var(--t-link); text-decoration: underline; text-underline-offset: 3px; cursor:pointer; }
  .acct-num { font-size:11.5px; color: var(--ink-3); margin-top:1px; }

  /* custom checkbox */
  .chk { width:18px; height:18px; border-radius:5px; border:1.5px solid var(--border-strong); background: var(--surface);
    display:inline-flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
  .chk:hover { border-color: var(--t-link); }
  .chk.checked { background: var(--brand); border-color: var(--brand); color: var(--t-onbrand,#fff); font-size:12px; font-weight:700; }
  .chk.checked::after { content:'\2713'; line-height:1; }
  .chk.indeterminate { background: var(--brand); border-color: var(--brand); color: var(--t-onbrand,#fff); }
  .chk.indeterminate::after { content:''; width:8px; height:2px; background: var(--t-onbrand,#fff); border-radius:1px; }

  .pill { display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:999px; font-size:11.5px; font-weight:600; }
  .pill.taxable { background: var(--warning-tint); color: var(--warning-tx); }
  .pill.deferred { background: var(--subtle); color: var(--ink-2); }
  .pill.free { background: var(--success-tint); color: var(--success-tx); }
  .pill.nontaxable { background: var(--subtle); color: var(--t-secondary); }
  .status-pill { display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; padding:3px 10px; border-radius:999px; }
  .status-pill.not_started { color: var(--ink-3); background:none; padding:0; }
  .status-pill.tax_review { color: var(--warning-tx); background: var(--warning-tint); }
  .status-pill.complete { color: var(--success-tx); background: var(--success-tint); }
  .status-pill .dot { width:7px; height:7px; border-radius:50%; }
  .status-pill.not_started .dot { background: var(--ink-3); }
  .status-pill.tax_review .dot { background: var(--warning-d); }
  .status-pill.complete .dot { background: var(--teal); }

  .icon-btn { border:none; background:none; cursor:pointer; color: var(--ink-3); padding:4px; border-radius:6px; font-size:14px; }
  .icon-btn:hover { background: var(--subtle); color: var(--t-link); }
  .exc-link { color: var(--t-link); font-weight:600; cursor:pointer; font-size:12.5px; }
  .add-link { color: var(--t-link); font-weight:600; cursor:pointer; font-size:13px; }
  .add-link:hover { text-decoration: underline; }

  .toolbar { display:flex; justify-content:space-between; align-items:center; margin-top:16px; }
  .toolbar .left-note { font-size:13px; color: var(--ink-2); }

  /* ---------- Buttons ---------- */
  .btn { border:none; border-radius: var(--radius-sm); padding:10px 18px; font-size:13.5px; font-weight:600; cursor:pointer; }
  .btn-primary { background: var(--brand); color: var(--t-onbrand,#fff); }
  .btn-primary:hover { background: var(--indigo-600); }
  .btn-primary:disabled { opacity:.38; cursor:not-allowed; }
  .btn-primary:active:not(:disabled) { background: var(--brand-active); }
  .btn-secondary { background: transparent; color: var(--t-secondary); border:1px solid var(--t-secondary); }
  .btn-secondary:disabled { opacity:.38; cursor:not-allowed; }
  .btn-secondary:hover:not(:disabled) { background: var(--subtle); color: var(--t-primary); }
  .btn-secondary:active:not(:disabled) { background: var(--b-default); color: var(--t-primary); }
  .btn-save-exit:hover { background: var(--tn-hover); color: var(--tn-hover-lbl); }
  .btn-save-exit:active { background: var(--tn-press); }
  .btn-ghost { background:none; color: var(--t-link); border:none; font-weight:600; padding:10px 6px; cursor:pointer; }
  .btn-row { display:flex; gap:10px; justify-content:flex-end; margin-top:20px; }

  /* ---------- Modal ---------- */
  .modal-overlay {
    position: fixed; inset:0; background: rgba(20,20,40,0.42);
    display:flex; align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .modal {
    background: var(--surface); border-radius: var(--radius); width:100%; max-width:640px;
    max-height:86vh; overflow-y:auto; box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    padding: 26px 28px;
  }
  .modal h2 { margin:0 0 6px; font-size:18px; }
  .modal p.sub { color: var(--ink-2); font-size:13px; margin:0 0 18px; }

  /* ---------- Portfolio picker ---------- */
  .pill-filter { display:inline-flex; padding:3px 12px; border-radius:999px; font-size:12.5px; font-weight:600; cursor:pointer; border:1px solid var(--border-strong); color: var(--ink-2); background: var(--surface); margin-right:8px; }
  .pill-filter.active { background: var(--brand); color: var(--t-onbrand,#fff); border-color: var(--brand); }
  .portfolio-grid { display:grid; grid-template-columns: 1fr 1fr; gap:14px; align-items:stretch; }
  @media (max-width: 720px) { .portfolio-grid { grid-template-columns: 1fr; } }
  .portfolio-card {
    background: var(--surface);
    border:1px solid var(--border-strong); border-radius: var(--radius); padding:14px 16px;
    cursor:pointer; display:flex; justify-content:space-between; align-items:flex-start; gap:12px;
  }
  .portfolio-card.selected { border-color: var(--brand-onsubtle); background: var(--tn-bg); }
  .portfolio-card .pf-name { font-weight:600; font-size:14px; }
  .pf-subtitle { font-size:12px; color: var(--ink-2); margin-top:3px; font-weight:500; }
  .portfolio-card .pf-desc { font-size:12.5px; color: var(--ink-2); margin-top:6px; }
  .details-link { font-size:12px; color: var(--t-link); font-weight:600; cursor:pointer; margin-top:8px; display:inline-block; }
  .cat-icon { width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex-shrink:0; }
  .cat-icon.cat-global-core { background: var(--tn-bg); color: var(--tn-lbl); }
  .cat-icon.cat-tax-sensitive { background: var(--success-tint); color: var(--success-tx); }
  .cat-icon.cat-core-alts { background: var(--warning-tint); color: var(--warning-tx); }
  .cat-icon.cat-us-core { background: var(--subtle); color: var(--ink-2); }
  .cat-icon.cat-multi-asset { background: var(--tn-bg); color: var(--tn-lbl); }
  .cat-icon.cat-custom { background: var(--subtle); color: var(--ink-2); }
  .cat-icon-inline { width:18px; height:18px; border-radius:5px; display:inline-flex; align-items:center; justify-content:center; font-size:9px; font-weight:700; vertical-align:middle; margin-right:5px; }

  /* Details panel (non-modal right drawer) */
  .details-panel {
    position: fixed; top:0; right:0; bottom:0; width:380px; max-width:92vw;
    background: var(--canvas); border-left:1px solid var(--border); box-shadow: -8px 0 24px rgba(0,0,0,0.12);

const STATUS_ORDER = { not_started:0, tax_review:1, complete:2 };

function setSort(key){
  if(state.sortKey!==key){ state.sortKey = key; state.sortDir = 'asc'; }
  else if(state.sortDir==='asc'){ state.sortDir = 'desc'; }
  else { state.sortKey = null; state.sortDir = 'asc'; } // 3rd press: back to default
  render();
}
function sortedAccounts(){
  const list = accounts.slice();
  if(!state.sortKey){
    list.sort((a,b)=> a.name.localeCompare(b.name)); // default: alphabetical by account name
    return list;
  }
  const dir = state.sortDir==='asc' ? 1 : -1;
  list.sort((a,b)=>{
    let av, bv;
    if(state.sortKey==='taxStatus'){ av = TAX_STATUS_ORDER[a.taxStatus]; bv = TAX_STATUS_ORDER[b.taxStatus]; }
    else if(state.sortKey==='value'){ av = a.value; bv = b.value; }
    else { av = STATUS_ORDER[statusOf(a)]; bv = STATUS_ORDER[statusOf(b)]; }
    return (av-bv)*dir;
  });
  return list;
}
function sortArrows(key){
  const active = state.sortKey===key;
  const up = active && state.sortDir==='asc';
  const down = active && state.sortDir==='desc';
  return `<span class="sort-arrows"><span class="${up?'active':''}">\u25B2</span><span class="${down?'active':''}">\u25BC</span></span>`;
}

/* tax figures: simplified deterministic calc so numbers change per option */
function taxFigures(a){
  const base = a.value;
  const mult = { minimal:0.35, median:0.62, max:0.94, custom: a.taxCustomAmt ? Math.min(1, (parseFloat(a.taxCustomAmt)||0)/ (base*0.03)) : 0.5 }[a.taxSetting] || 0.5;
  const shortTerm = -(base*0.0107*mult);
  const longTerm = -(base*0.00047*mult);
  const realized = shortTerm+longTerm;
  const taxLiab = realized*0.363;
  return {
    shortTerm, longTerm, realized, taxLiab,
    pctPortfolio: (taxLiab/base*100).toFixed(2)+'%',
    pctTraded: (40+mult*45).toFixed(2)+'%',
    pctInModel: (60+mult*38).toFixed(2)+'%',
    trackingError: (2.1 - mult*1.3).toFixed(2)+'%',
    years: mult>0.8 ? '~2-3 years' : mult>0.5 ? '~1-2 years' : '~6-12 months',
  };
}

function toggleSidebarAccounts(){ state.sidebarAccountsExpanded = !state.sidebarAccountsExpanded; render(); }
function toggleShowAllSidebarAccounts(){ state.sidebarShowAllAccounts = !state.sidebarShowAllAccounts; render(); }

const SIDEBAR_STEPS = [
  { key:'setup', num:1, label:'Proposal Setup' },
  { key:'currentPortfolio', num:2, label:'Current Portfolio Overview' },
  { key:'configure', num:3, label:'Configure Accounts' },
  { key:'proposed', num:4, label:'Proposed Portfolio Overview' },
  { key:'review', num:5, label:'Final Review' },
  { key:'generate', num:6, label:'Generate Proposal' },
  { key:'implement', num:7, label:'Implement' },
];
function currentStepKey(){
  if(state.view==='selectAccounts') return 'setup';
  if(state.view==='currentPortfolioOverview') return 'currentPortfolio';
  if(['overview','activeAccount','bulkPortfolioSelect'].includes(state.view)) return 'configure';
  if(state.view==='review') return 'review';
  if(state.view==='success') return 'generate';
  if(state.view==='stub' && state.stubLabel==='Proposed Portfolio Overview') return 'proposed';
  if(state.view==='stub' && state.stubLabel==='Implement') return 'implement';
  return null;
}
function stepUnlocked(key){
  if(key==='setup') return true;
  const setupDone = !!state.selectedHousehold && Object.values(state.selectAccountsChecked).some(v=>v);
  if(key==='currentPortfolio') return setupDone;
  return accounts.length>0; // configure/proposed/review/generate/implement: unlock once Continue has actually run
}
function stepComplete(key){
  if(key==='setup') return accounts.length>0;
  if(key==='configure') return accounts.length>0 && allResolved();
  if(key==='review' || key==='generate') return state.proposalGenerated;
  return false;
}
function goToCurrentPortfolioOverview(){
  if(accounts.length===0 && state.selectedHousehold){
    const master = freshAccountTemplate(state.selectedHousehold);
    accounts = master.filter(a => state.selectAccountsChecked[a.id]);
  }
  state.view='currentPortfolioOverview';
  render();
}
const SIDEBAR_STEP_NAV = {
  setup: "state.view='selectAccounts';render()",
  currentPortfolio: "goToCurrentPortfolioOverview()",
  configure: "state.view='overview';state.sidebarAccountsExpanded=true;render()",
  proposed: "openStub('Proposed Portfolio Overview')",
  review: "goReview()",
  generate: "goReview()",
  implement: "openStub('Implement')",
};
function renderSidebarStep(step){
  const unlocked = stepUnlocked(step.key);
  const isCurrent = currentStepKey()===step.key;
  const complete = stepComplete(step.key);
  const attrs = unlocked
    ? `tabindex="0" role="button" ${isCurrent?'aria-current="step"':''} onclick="${SIDEBAR_STEP_NAV[step.key]}"`
    : `tabindex="-1" aria-disabled="true" title="Complete Proposal Setup to unlock"`;
  const marker = complete ? `<span class="step-check">&#10003;</span>` : `<span class="step-num">${step.num}</span>`;
  const chevron = step.key==='configure'
    ? `<span class="chevron ${state.sidebarAccountsExpanded?'open':''}" style="cursor:pointer;" onclick="event.stopPropagation();toggleSidebarAccounts()">&#9656;</span>`
    : '';
  const subLine = (step.key==='configure' && accounts.length>0)
    ? `<div class="step-sub">${completedCount()} of ${accounts.length} accounts complete</div>` : '';

  let nested = '';
  if(step.key==='configure' && unlocked && state.sidebarAccountsExpanded){
    const TRUNCATE_AT = 8;
    const showAll = state.sidebarShowAllAccounts || accounts.length <= TRUNCATE_AT;
    const visibleAccounts = showAll ? accounts : accounts.slice(0, TRUNCATE_AT);
    const accRows = visibleAccounts.map(a=>{
      const s = statusOf(a);
      const isActive = state.view==='activeAccount' && state.activeAccountId===a.id;
      return `<div class="nav-account-row ${isActive?'active-acct':''}" onclick="openAccount('${a.id}')">
        <div class="name-wrap"><span class="name">${a.name} <span class="num-inline">(${a.num})</span></span></div>
        <span class="side-tag ${s}">${sideTagLabel(s)}${statusPencil(s, a.id)}</span>
      </div>`;
    }).join('');
    const showAllToggle = accounts.length > TRUNCATE_AT
      ? `<div class="nav-account-row" onclick="toggleShowAllSidebarAccounts()" style="color:var(--t-link);font-weight:600;">
          <span class="name" style="color:var(--t-link);">${showAll ? 'Show less' : 'Show all ('+accounts.length+')'}</span>
        </div>`
      : '';
    nested = `<div class="nav-sub">
      <div class="nav-account-row ${state.view==='overview'?'active-acct':''}" onclick="backToOverview()" style="font-weight:600;">
        <span class="name" style="color:${state.view==='overview'?'var(--tn-lbl)':'var(--ink)'}">Acct Progress Overview</span>
      </div>
      ${accRows}
      ${showAllToggle}
    </div>`;
  }

  return `<div class="step-item ${isCurrent?'current':''} ${unlocked?'clickable':''}" ${attrs}>
    ${marker}
    <div class="step-body">
      <div class="step-row-head"><span>${step.label}</span>${chevron}</div>
      ${subLine}
    </div>
  </div>${nested}`;
}
function renderSidebar(){
  return `

    <div class="brand"><div class="brand-mark"></div><div class="brand-name">FRONTIER ONE</div></div>
    ${SIDEBAR_STEPS.map(renderSidebarStep).join('')}
    <div class="sidebar-spacer"></div>
    <div class="theme-toggle" onclick="toggleTheme()" role="button" aria-pressed="${theme==='dark'}">

  <div class="alloc-legend">${parts.map(k=>`<div class="alloc-legend-item"><span class="alloc-swatch" style="background:${colors[k]}"></span>${labels[k]}: ${alloc[k]}%</div>`).join('')}</div>`;
}

/* ---------------- RENDER: BULK PORTFOLIO SELECT (full page, not a modal) ---------------- */
function renderBulkPortfolioSelect(){
  const selected = state.selectedIds.map(getAccount);
  const totalVal = selected.reduce((s,a)=>s+a.value,0);
  const list = portfolios.filter(p=> p.category===state.pillFilter)
    .map(p => renderPortfolioCard(p, state.pendingPortfolioId===p.id, `onclick="state.pendingPortfolioId='${p.id}';state.portfolioSelectError=false;render()"`))
    .join('');

  return `
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;">
      <div>
        <h1 class="page-title">Select portfolio for ${selected.length} account${selected.length>1?'s':''}</h1>
        <p class="page-sub">Applying portfolio choice to: ${selected.map(a=>a.name).join(', ')}</p>
      </div>
      <button class="btn btn-secondary" disabled title="Coming in a future release" style="flex-shrink:0;">Compare (coming soon)</button>
    </div>

    <div style="background:var(--subtle);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:18px;">
      <div style="font-weight:700;font-size:12.5px;margin-bottom:8px;">Selected accounts allocation target</div>
      ${selected.map(a=>`<div style="display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;"><span>${a.name}</span><span style="font-weight:600">${fmt(a.value)}</span></div>`).join('')}
      <div style="display:flex;justify-content:space-between;font-size:12.5px;padding:6px 0 0;border-top:1px solid var(--border);margin-top:6px;font-weight:700;"><span>Total applied value</span><span>${fmt(totalVal)}</span></div>
    </div>

    <div style="margin-bottom:14px">${renderPortfolioPillFilters()}</div>
    <div class="portfolio-grid">${list}</div>

    ${state.portfolioSelectError ? `<div style="color:var(--danger-tx);font-size:13px;font-weight:600;margin-top:16px;">Choose a portfolio to continue.</div>` : ''}
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="state.view='overview';state.detailsOpenId=null;render()">Cancel</button>
      <button class="btn btn-primary" onclick="attemptApplyBulk()">Apply to selected accounts</button>
    </div>
  `;
}

/* ---------------- RENDER: MIXED TAX WARNING ---------------- */
function renderMixedWarning(){
  const selected = state.selectedIds.map(getAccount);
  const taxableAccts = selected.filter(a=>a.taxStatus==='taxable');
  const deferredAccts = selected.filter(a=>a.taxStatus==='deferred');
  const freeAccts = selected.filter(a=>a.taxStatus==='free');
  const groups = [['Taxable', taxableAccts], ['Tax-Deferred', deferredAccts], ['Tax-Free', freeAccts]].filter(([,list])=>list.length>0);
  return `
  <div class="modal-overlay">
    <div class="modal" style="max-width:520px">
      <h2>Mixed tax status warning</h2>
      <p class="sub">You're applying the same portfolio to accounts with different tax statuses.</p>
      <div class="banner amber">
        <div><b>${taxableAccts.length} of ${selected.length}</b> selected accounts are taxable and will still need individual tax settings reviewed after this is applied. Tax-deferred and tax-free accounts require no further tax action.</div>
      </div>
      ${groups.map(([label,list])=>`
        <div style="margin:12px 0 6px;font-weight:600;font-size:12.5px;">${label}</div>
        ${list.map(a=>`<div style="font-size:13px;padding:4px 0;">${a.name} \u2014 ${a.num}</div>`).join('')}
      `).join('')}
      <div class="btn-row">
        <button class="btn btn-secondary" onclick="cancelMixedWarning()">Go back and adjust selection</button>
        <button class="btn btn-primary" onclick="finalizeBulkApply()">Proceed</button>
      </div>
    </div>
  </div>`;
}

/* ---------------- RENDER: CONFLICT WARNING ---------------- */
function renderConflictWarning(){
  const c = state.conflictAccounts;
  return `
  <div class="modal-overlay">
    <div class="modal" style="max-width:520px">
      <h2>Potential override conflict</h2>
      <p class="sub">Some selected accounts already have an individually-assigned portfolio.</p>
      <div class="banner red">
        <div>Applying a shared portfolio will overwrite the existing configuration for:
          <div style="margin-top:6px;font-weight:600;">${c.map(a=>a.name + ' (' + portfolioName(a.portfolio) + ')').join(', ')}</div>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-secondary" onclick="proceedPastConflict(true)">Exclude these accounts</button>
        <button class="btn btn-primary" onclick="proceedPastConflict(false)">Proceed &amp; overwrite</button>
      </div>
    </div>
  </div>`;
}

/* ---------------- RENDER: ACCOUNT WORKSPACE ---------------- */
function renderAccountWorkspace(){
  const a = getAccount(state.activeAccountId);
  let tabs = [['current','Current Portfolio'],['portfolio','Portfolio Selection'],['exceptions','Special Instructions']];
  if(isTaxable(a)) tabs.push(['tax','Tax Settings']);
  tabs.push(['history','History']);

  let body = '';
  if(state.activeTab==='current'){
    body = `<div class="table-card" style="padding:20px;">
      <div style="display:flex;gap:40px;">
        <div><div class="tf-label">Total value</div><div class="tf-value" style="font-size:18px">${fmt(a.value)}</div></div>
        <div><div class="tf-label">Current model</div><div class="tf-value">Tax-Sensitive ETF 20/80</div></div>
      </div>
    </div>`;
  } else if(state.activeTab==='portfolio'){
    const bannerHtml = (a.portfolio && a.source==='bulk')
      ? `<div class="assigned-banner">Assigned via bulk configuration: ${portfolioName(a.portfolio)}. You can override it below for this account only.</div>` : '';
    const list = portfolios.filter(p=> p.category===state.pillFilter)
      .map(p => renderPortfolioCard(p, a.portfolio===p.id, `onclick="setIndividualPortfolio('${p.id}')"`))
      .join('');
    body = `${bannerHtml}
      <div style="margin-bottom:14px">${renderPortfolioPillFilters()}</div>
      <div class="portfolio-grid">${list}</div>`;
  } else if(state.activeTab==='history'){
    const typeLabels = { portfolio:'Portfolio', tax:'Tax Settings', special:'Special Instruction' };
    const entries = (a.history||[]).filter(h => h.type!=='tax' || isTaxable(a));
    const rows = entries.map(h=>{
      const isCurrent = h.state==='current';
      const dateLine = isCurrent ? `Applied ${h.applied}` : `Applied ${h.applied} \u2192 ${h.state==='replaced'?'Replaced':'Lifted'} ${h.endDate}`;
      return `<div class="history-item ${isCurrent?'':'muted'}">
        <div class="hist-type">${typeLabels[h.type]}</div>
        <div class="hist-setting">${h.setting}</div>
        <div class="hist-dates">${dateLine}</div>
        <span class="hist-state-pill ${h.state}">${h.state.charAt(0).toUpperCase()+h.state.slice(1)}</span>
      </div>`;
    }).join('');
    body = `<p class="page-sub" style="margin-bottom:12px;">A chronological record of portfolio, tax settings, and special instruction changes for this account.</p>
    <div class="table-card" style="padding:6px 18px;">
      ${rows || '<div class="empty-note">No configuration history yet for this account.</div>'}
    </div>`;
  } else if(state.activeTab==='exceptions'){
    const fieldMeta = [['tradingHold','Trading Hold'],['cashReserve','Cash Reserve Policy'],['securityRestrictions','Security Restrictions'],['recurringWithdrawals','Recurring Withdrawals']];
    const siRows = fieldMeta.map(([key,label])=>{
      const val = a.special[key];
      const hasVal = val && val !== 'None';
      const editing = state.editingSpecial===key;
      let valueCell;
      if(editing){
        valueCell = `<input type="text" class="si-edit-input" value="${state.editingSpecialVal}" oninput="state.editingSpecialVal=this.value">
          <span class="si-edit-link" onclick="saveEditSpecial()">Save</span>
          <span class="si-edit-link" onclick="cancelEditSpecial()" style="color:var(--ink-3)">Cancel</span>`;
      } else {
        valueCell = `<span class="si-value ${hasVal?'has-value':''}">${val}</span>
          <span class="si-edit-link" onclick="startEditSpecial('${key}')">${hasVal?'Edit':'Add'}</span>`;
      }
      return `<tr><td class="si-label">${label}</td><td>${valueCell}</td></tr>`;
    }).join('');

    const list = a.exceptions.map((e,i)=>`<div class="exception-item"><span>${e}</span><span class="exception-remove" onclick="removeException(${i})">Remove</span></div>`).join('');

    body = `
    <div class="si-section-title">On file</div>
    <p class="si-sub">Set when this account was onboarded. Editable here, but these live at the account level, not just this proposal.</p>
    <div class="table-card" style="padding:6px 18px 12px;margin-bottom:22px;">
      <table class="si-table">${siRows}</table>
    </div>

    <div class="si-section-title">Additional exceptions for this proposal</div>
    <p class="si-sub">Account-specific trading exceptions \u2014 e.g. don't trade a particular security, or reserve a dollar amount from this account. Separate from portfolio-level screening restrictions.</p>
    <div class="table-card" style="padding:6px 18px;">
      ${list || '<div class="empty-note">No additional exceptions added for this account.</div>'}
    </div>
    <div class="add-exception-form">
      <select onchange="state.excFormType=this.value;render()">
        ${exceptionTypes.map(t=>`<option value="${t.id}" ${state.excFormType===t.id?'selected':''}>${t.label}</option>`).join('')}
      </select>
      <input type="text" placeholder="${state.excFormType==='no_trade'?'Ticker or security name':state.excFormType==='reserve'?'Amount, e.g. 5000':'Describe the instruction'}" value="${state.excFormValue}" oninput="state.excFormValue=this.value">
      <button class="btn btn-secondary" onclick="addException()">Add exception</button>
    </div>`;
  } else if(state.activeTab==='tax'){
    const opts = [['minimal','Minimal gains'],['median','Median gains'],['max','Max gains'],['custom','Custom']];
    const optsHtml = opts.map(([id,label])=>{
      const checked = a.taxSetting===id;
      const customField = id==='custom' && checked ? `<div class="custom-input"><span>$</span><input type="text" placeholder="Enter amount" value="${a.taxCustomAmt}" oninput="setCustomAmt(this.value)"></div>` : '';
      return `<div class="radio-line ${checked?'checked':''}" onclick="setTaxSetting('${id}')"><div class="radio-circle"></div><div class="rl-label">${label}</div></div>${customField}`;
    }).join('');
    const fig = a.taxSetting ? taxFigures(a) : null;
    body = `<div class="table-card" style="padding:6px 18px;">${optsHtml}</div>
    ${fig ? `<div class="tax-panel">
      <h4>Realized gain and tax</h4>
      <div class="tax-row"><span class="k">Short term gain</span><span class="v">${fmt(fig.shortTerm)}</span></div>
      <div class="tax-row"><span class="k">Long term gain</span><span class="v">${fmt(fig.longTerm)}</span></div>
      <div class="tax-row"><span class="k">Realized gains</span><span class="v">${fmt(fig.realized)}</span></div>
      <div class="tax-row"><span class="k">Estimated tax liability</span><span class="v">${fmt(fig.taxLiab)}</span></div>
      <div class="tax-row"><span class="k">Tax liability % of portfolio value</span><span class="v">${fig.pctPortfolio}</span></div>
      <div class="tax-row"><span class="k">% portfolio value traded</span><span class="v">${fig.pctTraded}</span></div>
      <div class="tax-row"><span class="k">% in-model value</span><span class="v">${fig.pctInModel}</span></div>
      <div class="tax-row"><span class="k">Tracking error</span><span class="v">${fig.trackingError}</span></div>
      <div class="tax-row"><span class="k">Estimated years to complete</span><span class="v">${fig.years}</span></div>
    </div>` : `<div class="empty-note">Select a gains option to see the realized gain and tax impact.</div>`}
    `;
  }

  const order = tabOrderFor(a);
  const isLastTab = order.indexOf(state.activeTab) === order.length-1;
  const tabLabels = { current:'Current Portfolio', portfolio:'Portfolio Selection', exceptions:'Special Instructions', tax:'Tax Settings', history:'History' };
  const nextLabel = isLastTab ? 'Save &amp; return to overview' : 'Save &amp; continue to ' + tabLabels[order[order.indexOf(state.activeTab)+1]];

  return `
    <div class="acct-header">
      <div class="field"><div class="label">Account</div><div class="val">${a.name}</div></div>
      <div class="field"><div class="label">Type</div><div class="val">${a.type}</div></div>
      <div class="field"><div class="label">Account #</div><div class="val">${a.num}</div></div>
      <div class="field"><div class="label">Tax status</div><div class="val">${taxStatusLabel(a)}</div></div>
      <div class="field"><div class="label">Value</div><div class="val">${fmt(a.value)}</div></div>
    </div>
    <div class="tabs">
      ${tabs.map(([id,label])=>`<div class="tab ${state.activeTab===id?'active':''}" onclick="state.activeTab='${id}';render()">${label}</div>`).join('')}
    </div>
    ${body}
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="cancelAccountWorkspace()">Cancel</button>
      <button class="btn btn-primary" onclick="saveAndContinueTab()">${nextLabel}</button>
    </div>
  `;
}

/* ---------------- RENDER: REVIEW ---------------- */
function renderReview(){
  const resolved = allResolved();
  const rows = sortedAccounts().map(a=>{
    const s = statusOf(a);
    const flagged = s!=='complete';
    const sc = specialCount(a);
    const excCell = sc>0
      ? `<span class="exc-link" onclick="event.stopPropagation();openInstructionsPanel('${a.id}')">${sc} instruction${sc>1?'s':''}</span>`
      : '\u2013';
    const planLabel = taxPlanLabel(a);
    const taxPlanCell = !isTaxable(a) ? '<span style="color:var(--t-secondary)" title="Tax plans apply to taxable accounts only.">Not applicable</span>' : (planLabel || '<span style="color:var(--red-text);font-weight:600;">Not set</span>');
    return `<tr style="${flagged?'background:var(--warning-tint)':''}">
      <td><div class="acct-name" onclick="openAccount('${a.id}')">${a.name} <span style="color:var(--ink-3);font-weight:500;">(${a.num})</span></div><div class="acct-num">${a.type}</div></td>
      <td><span class="pill ${a.taxStatus}">${taxStatusLabel(a)}</span></td>
      <td>${portfolioNameWithIcon(a.portfolio)}</td>
      <td>${taxPlanCell}</td>
      <td>${excCell}</td>
      <td>${flagged? `<span class="fix-link" onclick="openAccount('${a.id}','${!a.portfolio ? 'portfolio' : 'tax'}')">Fix issue</span>` : '\u2013'}</td>
      <td><span class="status-pill ${s}"><span class="dot"></span>${statusLabel(s)}${statusPencil(s, a.id)}</span></td>
    </tr>`;
  }).join('');

  return `
    <h1 class="page-title">Proposal Review</h1>
    <p class="page-sub">Verify all configuration metrics. Unresolved items are highlighted below.</p>
    ${!resolved ? `<div class="banner red" style="background:var(--danger-tint-canvas)">Generation is blocked until every account has a target portfolio and every taxable account has completed tax settings.</div>` : `<div class="banner neutral" style="background:var(--success-tint-canvas);color:var(--success-tx);border-color:var(--success-d)">All accounts are complete. Tax settings are saved where applicable. Ready to generate trade directives and final documentation.</div>`}
    <div class="table-card">
      <table>
        <thead><tr><th>Account</th>
          <th><span class="th-sort" onclick="setSort('taxStatus')">Tax status ${sortArrows('taxStatus')}</span></th>
          <th>Target portfolio</th><th>Tax plan</th><th>Special instructions</th><th>Issue</th>
          <th><span class="th-sort" onclick="setSort('status')">Status ${sortArrows('status')}</span></th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="backToOverview()">Back to configuration</button>
      <button class="btn btn-primary" ${resolved?'':'disabled'} onclick="generateProposal()">Generate Proposal</button>
    </div>
  `;
}

/* ---------------- RENDER: SUCCESS ---------------- */
function renderSuccess(){
  const bulkGroups = {};
  accounts.forEach(a=>{
    if(a.source==='bulk'){
      bulkGroups[a.portfolio] = bulkGroups[a.portfolio] || [];
      bulkGroups[a.portfolio].push(a.name);
    }
  });
  const indiv = accounts.filter(a=>a.source==='individual');
  return `
  <div class="success-wrap">
    <div class="success-circle" style="font-size:28px;color:var(--green-text);">&#10003;</div>
    <h1 class="page-title">Proposal Generated Successfully</h1>
    <p class="page-sub">${HOUSEHOLDS[state.selectedHousehold].label} \u2014 F1P-2026-002301</p>
    <div class="success-box">
      <div style="font-weight:700;font-size:12px;letter-spacing:0.02em;color:var(--ink-3);margin-bottom:6px;">ALLOCATION SUMMARY</div>
      <ul>
        ${Object.keys(bulkGroups).map(pid=>`<li>Bulk ${portfolioName(pid)} \u2192 ${bulkGroups[pid].join(', ')}</li>`).join('')}
        ${indiv.map(a=>`<li>Individual ${portfolioName(a.portfolio)} \u2192 ${a.name}</li>`).join('')}
      </ul>
    </div>
    <div class="btn-row" style="justify-content:center">
      <button class="btn btn-secondary" onclick="resetPrototype()">Start over</button>
      <button class="btn btn-primary" onclick="backToOverview()">Return to dashboard</button>
    </div>
  </div>`;
}

/* ---------------- ROOT RENDER ---------------- */
function renderResetConfirm(){
  return `
  <div class="modal-overlay">
    <div class="modal" style="max-width:420px">
      <h2>Reset prototype?</h2>
      <p class="sub">This clears every account, portfolio assignment, tax setting, and exception, and returns you to the account-selection screen.</p>
      <div class="btn-row">
        <button class="btn btn-secondary" onclick="cancelReset()">Cancel</button>
        <button class="btn btn-primary" style="background:var(--danger-d)" onclick="resetPrototype()">Reset prototype</button>
      </div>
    </div>
  </div>`;
}

function render(){
  if(state.view==='selectAccounts'){
    const resetOverlay = state.showResetConfirm ? renderResetConfirm() : '';
    document.getElementById('app').innerHTML = renderSidebar() + renderSelectAccounts() + (state.toast? `<div class="toast"><b>${state.toast.title}</b>${state.toast.body}</div>` : '') + resetOverlay + renderPrototypeChip();
    return;
  }

  let contentHtml = '';
  if(state.view==='overview') contentHtml = renderOverview();
  else if(state.view==='bulkPortfolioSelect') contentHtml = renderBulkPortfolioSelect();
  else if(state.view==='currentPortfolioOverview') contentHtml = renderCurrentPortfolioOverview();
  else if(state.view==='activeAccount') contentHtml = renderAccountWorkspace();
  else if(state.view==='review') contentHtml = renderReview();
  else if(state.view==='success') contentHtml = renderSuccess();
  else if(state.view==='stub') contentHtml = renderStub();

  let overlays = '';
  if(state.showMixedWarning) overlays += renderMixedWarning();
  if(state.showConflictWarning) overlays += renderConflictWarning();
  if(state.showResetConfirm) overlays += renderResetConfirm();
  if(state.detailsOpenId) overlays += renderDetailsPanel();
  if(state.instructionsPanelAccountId) overlays += renderInstructionsPanel();
  if(state.toast) overlays += `<div class="toast"><b>${state.toast.title}</b>${state.toast.body}</div>`;
  overlays += renderPrototypeChip();

  document.getElementById('app').innerHTML = `
    ${renderSidebar()}
    <div class="main">
      ${renderTopbar()}
      <div class="content">${contentHtml}</div>
    </div>
    ${overlays}
  `;
}

render();
</script>
</body>
</html>
